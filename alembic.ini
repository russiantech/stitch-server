[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path additions so `app.*` imports resolve when alembic runs
prepend_sys_path = .

# Timezone for migration file timestamps
; timezone = UTC
; timezone = Etc/UTC

# NOTE: sqlalchemy.url is intentionally left blank here.
# env.py pulls the real URL from your app's settings/env vars at runtime,
# so this file never has to hold a connection string (and never risks
# being out of sync with .env or getting committed with a real password).
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format generated migrations with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
