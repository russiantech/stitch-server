<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
	body{margin:0;padding:0;background:#f6f7fb;font-family:'Nunito Sans',Arial,sans-serif;color:#1e293b}
	.wrap{max-width:560px;margin:0 auto;padding:24px 16px}
	.card{background:#fff;border-radius:12px;padding:40px 36px;border:1px solid #e5e7eb}
	.logo{font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:800;color:#5826ee;letter-spacing:-0.02em;margin-bottom:28px}
	.logo span{color:#f38207}
	h1{font-family:Montserrat,Arial,sans-serif;font-size:20px;font-weight:700;margin:0 0 12px;color:#1e293b}
	p{font-size:14px;line-height:1.7;margin:0 0 16px;color:#475569}
	.otp{font-size:36px;font-weight:800;letter-spacing:8px;color:#5826ee;font-family:monospace;text-align:center;padding:24px;background:#ede9ff;border-radius:10px;margin:24px 0}
	.btn{display:inline-block;padding:13px 28px;background:#5826ee;color:#fff!important;text-decoration:none;border-radius:8px;font-weight:700;font-size:14px;margin:8px 0}
	.footer{text-align:center;font-size:12px;color:#94a3b8;margin-top:28px;padding-top:20px;border-top:1px solid #e5e7eb}
	.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
	.badge-success{background:#d1fae5;color:#065f46}
	.badge-warn{background:#fef9c3;color:#854d0e}
	.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
	.info-row:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="wrap">
	<div class="card">
		{# <div class="logo">✂ Stitch<span>.</span></div> #}
		<div class="logo">✂ Stitch<span>.</span></div> 
		{% block content %}{% endblock %}
		<div class="footer">
			&copy; {{ year or 2027 }} Stitch Platform. All rights reserved.<br>
			<a href="{{ frontend_url or 'https://stitch.ng' }}" style="color:#5826ee;text-decoration:none">stitch.ng</a>
		</div>
	</div>
</div>
</body>
</html>
